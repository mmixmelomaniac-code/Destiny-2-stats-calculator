<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Destiny 2 Stat Spread Calculator</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #101722;
  color: #f3f6fc;
  max-width: 900px;
  margin: auto;
  padding: 24px;
}
h1 { color: #8dc5ff; }
.panel {
  background: #1c293a;
  padding: 18px;
  border-radius: 12px;
  margin: 16px 0;
}
.stats {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 12px;
}
label { display: block; margin-bottom: 6px; }
input, select, button {
  box-sizing: border-box;
  width: 100%;
  padding: 10px;
  border-radius: 6px;
  border: 1px solid #536780;
  font-size: 16px;
}
button {
  background: #2777d4;
  color: white;
  cursor: pointer;
  border: 0;
  margin-top: 12px;
  font-weight: bold;
}
button:hover { background: #398de9; }
.statline { margin: 12px 0; }
.bar {
  background: #344256;
  height: 10px;
  border-radius: 8px;
  overflow: hidden;
}
.fill { background: #48b987; height: 100%; }
code { color: #a9d6ff; }
@media(max-width:550px) {
  .stats { grid-template-columns: repeat(2, 1fr); }
}
</style>
</head>
<body>
<h1>Stat Spread Calculator</h1>
<p>Choose target stats and find a combination of five function variations.</p>
<div class="panel">
  <h2>Target stats</h2>
  <p>Enter exact values from 0 to 150.</p>
  <div class="stats" id="inputs"></div>
<h3 style="margin-top:16px">Stat Priority Order</h3>
<p>Use the arrows to arrange your preferred stat priority.</p>
<div id="priority-list"></div>
  <button id="calculate">Find exact spread</button>
</div>
<div class="panel" id="result" aria-live="polite">
  Enter your targets and click Find exact spread.
</div>
<script>
const stats = ["W", "H", "S", "C", "G", "M"];
  const statNames = {
  W: "Weapons",
  H: "Health",
  S: "Super",
  C: "Class",
  G: "Grenade",
  M: "Melee"
};

let priorityOrder = [...stats];

function renderPriorityList() {
  const list = document.getElementById("priority-list");
  list.innerHTML = "";

  priorityOrder.forEach((stat, index) => {
    const row = document.createElement("div");
    row.style.cssText =
      "display:flex;align-items:center;gap:12px;" +
      "padding:10px;margin:6px 0;background:#26354b;" +
      "border-radius:8px;color:white;";

    const name = document.createElement("span");
    name.textContent =
      `${index + 1}. ${statNames[stat]}`;
    name.style.flex = "1";

    const up = document.createElement("button");
    up.textContent = "↑";
    up.disabled = index === 0;
    up.setAttribute("aria-label", `Move ${statNames[stat]} up`);
    up.onclick = () => {
      [priorityOrder[index - 1], priorityOrder[index]] =
        [priorityOrder[index], priorityOrder[index - 1]];
      renderPriorityList();
    };

    const down = document.createElement("button");
    down.textContent = "↓";
    down.disabled = index === priorityOrder.length - 1;
    down.setAttribute("aria-label", `Move ${statNames[stat]} down`);
    down.onclick = () => {
      [priorityOrder[index], priorityOrder[index + 1]] =
        [priorityOrder[index + 1], priorityOrder[index]];
      renderPriorityList();
    };

    row.append(name, up, down);
    list.appendChild(row);
  });
}

renderPriorityList();

// Each parent: [parent name, +30 stat, +25 stat]
cconst parents = [
  ["B", "Bulwark", "H", "C"],
  ["O", "Siegebreaker", "H", "G"],
  ["I", "Powerhouse", "W", "S"],
  ["E", "Gunner", "W", "G"],
  ["P", "Colossus", "S", "H"],
  ["Z", "Paragon", "S", "M"],
  ["R", "Reaver", "C", "M"],
  ["J", "Specialist", "C", "W"],
  ["D", "Demolitionist", "G", "C"],
  ["K", "Grenadier", "G", "S"],
  ["F", "Skirmisher", "M", "W"],
  ["A", "Brawler", "M", "H"]
];
// Generate four variations for each parent.
// A bonus can go to any stat not already in that parent.
const functions = [];
for (const [name, archetype, primary, collateral] of parents) {
  for (const bonus of stats) {
    if (bonus === primary || bonus === collateral) continue;

    const values = Object.fromEntries(
      stats.map(s => [s, 0])
    );

    values[primary] = 30;
    values[collateral] = 25;
    values[bonus] = 20;

    functions.push({
      id: name + "" + bonus,
      name: `${archetype} — Tertiary: ${statNames[tertiary]}`,
      archetype: archetype,
      parent: name,
      primary: primary,
      collateral: collateral,
      bonus: bonus,
      values: values
    });
  }
}
const inputs = document.getElementById("inputs");
for (const stat of stats) {
  const label = document.createElement("label");
  label.textContent = stat + " target";
  const input = document.createElement("input");
  input.type = "number";
  input.min = "0";
  input.max = "150";
  input.step = "1";
  input.value = "0";
  input.id = "target-" + stat;
  label.appendChild(input);
  inputs.appendChild(label);
}
function findSpread(target) {
  const zero = stats.map(() => 0);
  const key = (arr, count) => count + "|" + arr.join(",");

  function compareSolutions(a, b) {
    for (const stat of priorityOrder) {
      const i = stats.indexOf(stat);
      if (a.totals[i] !== b.totals[i]) {
        return b.totals[i] - a.totals[i];
      }
    }
    return 0;
  }

  let states = new Map();
  states.set(key(zero, 0), { totals: zero, chosen: [] });

  for (let slot = 0; slot < 5; slot++) {
    const next = new Map();

    for (const state of states.values()) {
      for (const fn of functions) {
        const totals = state.totals.map(
          (v, i) => v + fn.values[stats[i]]
        );

        if (totals.some(
          (v, i) => v > target[stats[i]] || v > 150
        )) continue;

        const chosen = [...state.chosen, fn];
        const k = key(totals, slot + 1);

        if (!next.has(k)) {
          next.set(k, { totals, chosen });
        }
      }
    }

    states = next;
    if (states.size === 0) return null;
  }

  const solutions = [...states.values()];
  solutions.sort(compareSolutions);
  return solutions[0] || null;
}

function renderSpread(spread, target) {
  const result = document.getElementById("result");

  if (!spread) {
    result.innerHTML =
      "<h2>No valid spread found</h2>" +
      "<p>Try increasing one or more maximum stat values. " +
      "Each stat must be between 0 and 150.</p>";
    return;
  }

  const counts = {};
  for (const fn of spread.chosen) {
    counts[fn.name] = (counts[fn.name] || 0) + 1;
  }

  result.innerHTML =
    "<h2>Best spread found</h2>" +
    "<p>Five function selections:</p>" +
    "<ul>" +
    Object.entries(counts).map(([name, count]) =>
      `<li><code>${name}</code> × ${count}</li>`
    ).join("") +
    "</ul>" +
    "<h3>Resulting stats</h3>" +
    stats.map((s, i) =>
      `<div class="statline"><strong>${statNames[s]}: ${spread.totals[i]}</strong>` +
      `<div class="bar"><div class="fill" style="width:${spread.totals[i] / 150 * 100}%"></div></div></div>`
    ).join("");
} 	
}
document.getElementById("calculate").addEventListener("click", () => {
  const target = {};
  for (const stat of stats) {
    const value = Number(document.getElementById("target-" + stat).value);
    if (!Number.isInteger(value) || value < 0 || value > 150) {
      document.getElementById("result").textContent =
        "Every target must be a whole number from 0 to 150.";
      return;
    }
    target[stat] = value;
  }
  const spread = findSpread(target);
  renderSpread(spread, target);
});
</script>
</body>
</html>
